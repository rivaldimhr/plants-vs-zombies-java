# Setiap push / pull request:
#   1. unit test + JAR
#   2. test end-to-end desktop: pemain otomatis (tools/demo/DemoPlayer) memainkan Level 1 di layar virtual
#   3. test versi browser: game dimuat lewat CheerpJ di Chromium, menu tampil, klik START & Level 1 berfungsi
# Push ke main: versi browser dipublikasikan ke branch gh-pages.
# Push ke main juga membuat/memperbarui GitHub Release sesuai file VERSION (JAR terlampir).
# Setiap tag v* (misalnya v1.0.0): JAR otomatis dilampirkan ke GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit test
        run: sh ./test.sh

      - name: Build JAR + versi browser
        run: |
          pip3 install -q pillow
          sh ./build-web.sh

      - name: Test end-to-end desktop (pemain otomatis, 70 detik)
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          javac -encoding UTF-8 -cp dist/plants-vs-zombies.jar -d tools/demo/out tools/demo/DemoPlayer.java
          set -o pipefail
          mkdir -p dist/web/check
          xvfb-run -a -s "-screen 0 1280x800x24" java -Ddemo.out=dist/web/check -cp dist/plants-vs-zombies.jar:tools/demo/out DemoPlayer 70 2>&1 | tee e2e.log
          grep DEMO_SUMMARY e2e.log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test versi browser (CheerpJ + Chromium)
        if: always()
        run: |
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium >/dev/null
          python tools/web_smoke.py dist/web dist/web/check
      - name: Pasang daftar resource CheerpJ hasil test (preloadResources)
        run: |
          if [ -f dist/web/check/cj-resources.json ]; then cp dist/web/check/cj-resources.json dist/web/; fi
          ls -la dist/web

      - name: Ukur kinerja versi browser (informasi, tidak menggagalkan build)
        if: always()
        continue-on-error: true
        run: |
          # JAR tanpa kompresi untuk perbandingan; build-jar.sh menghapus dist/, jadi simpan dulu lalu kembalikan
          rm -rf /tmp/dist-save && cp -r dist /tmp/dist-save
          NO_COMPRESS=1 sh ./build-jar.sh >/dev/null && cp dist/plants-vs-zombies.jar /tmp/full.jar
          rm -rf dist && cp -r /tmp/dist-save dist && cp /tmp/full.jar dist/web/plants-vs-zombies-full.jar
          python tools/web_bench.py dist/web dist/web/check/bench.json
          rm -f dist/web/plants-vs-zombies-full.jar

      - name: Simpan hasil cek browser ke branch ci-check
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/web/check
          publish_branch: ci-check
          force_orphan: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plants-vs-zombies
          path: |
            dist/plants-vs-zombies.jar
            dist/web/check

      - name: Publikasikan versi browser ke gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/web
          force_orphan: true

      - name: Rilis versi di file VERSION (dibuat sekali, JAR diperbarui di push berikutnya)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(cat VERSION)"
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" dist/plants-vs-zombies.jar --clobber
          else
            gh release create "$V" dist/plants-vs-zombies.jar --target "$GITHUB_SHA" --title "$V" --notes-file .github/release-notes.md
          fi

      - name: Release dari tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/plants-vs-zombies.jar
